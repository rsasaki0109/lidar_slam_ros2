      '\b(exp14|exp16|exp18)\b|basement[ _-]+2|attic[ _-]+to[ _-]+upper[ _-]+gallery[ _-]+2|corridor[ _-]+lower[ _-]+gallery[ _-]+2'
      <repository_roots>
    media_exact_candidate_search: >-
      find /media/sasaki -type f \( -iname '*exp14*' -o -iname '*exp16*'
      -o -iname '*exp18*' -o -iname '*basement*2*'
      -o -iname '*attic*upper*gallery*2*'
      -o -iname '*corridor*lower*gallery*2*' \)
  results:
    repo_exact_candidate_matches: 0
    media_exact_candidate_matches: 0
    local_hilti_sequence_dirs: [exp01, exp02, exp03, exp04, exp07, exp21]
    local_hilti_candidate_dirs_or_gt: 0
  limitations:
    - audit_does_not_prove_external_historical_use_absent
    - candidate_freshness_is_bounded_to_recorded_repo_and_media_scope
    - no_candidate_content_or_ground_truth_values_were_read

blind_policy:
  state_machine: [selected_unopened, downloaded_hashed, frozen_unopened, evaluating, scored]
  required_order:
    - commit_selection_receipt_before_download
    - download_bags_ground_truth_and_calibration
    - verify_official_bag_sha256_and_record_input_gt_calibration_hashes
    - set_profile_slots_to_frozen_unopened_only_after_hashes_exist
    - run_first_system_only_after_frozen_unopened_receipt_is_reviewed
    - score_gt_after_first_execution_and_keep_all_systems_on_same_input_tree
  prohibited_before_frozen_unopened:
    - reading_ground_truth_content
    - computing_trajectory_metrics
    - tuning_algorithm_or_competitor_parameters
    - publishing_performance_or_sota_claims
  common_execution_identity:
    - canonical_input_tree_hash
    - calibration_archive_hash
    - ros_conversion_and_topic_semantic_hash
    - pinned_container_toolchain_release_and_thread_policy
    - common_scorer_fingerprint

limitations:
  input_manifest_sha256: recorded_per_slot_after_deep_verification
  ground_truth_sha256: opaque_recorded_per_slot_without_parser
  calibration_archive_sha256: canonical_calibration_tree_recorded_per_slot
  calibration_archive_hash_kind: canonical_calibration_tree_sha256_v1
  selection_receipt_sha256_is_recorded_in_profile_and_execution_receipt: true
  managed_root_deep_verification_status: PASS
  managed_root_deep_verification_scope: read_only_identity_only_no_gt_parser_or_metrics
  no_performance_data: true
  no_readme_change_authorized: true
