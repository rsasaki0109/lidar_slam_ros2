competitive_slam_profile:
  schema_version: 1
  name: competitive_slam_v1
  frozen_on: '2026-07-14'
  repetitions: 3
  excluded_capabilities:
    - saved_map_loading
    - localization_mode
    - relocalization
  execution_contract:
    same_bag_bytes: true
    same_sensor_messages: true
    same_bag_bytes_scope: identical_within_each_ros_representation_and_all_repetitions
    cross_ros_representation_policy: canonical_deserialized_message_digest
    require_cross_ros_topic_counts_equal: true
    require_cross_ros_record_timestamps_equal: true
    require_cross_ros_all_sensor_fields_equal: true
    ignored_cross_ros_transport_fields: [std_msgs/Header.seq]
    same_calibration: true
    same_machine: true
    same_alignment_policy: true
    hash_all_inputs: true
    report_failed_runs: true
    unknown_metrics_must_be_omitted: true
  runtime_policy:
    playback_rate: 1.0
    gate_metric: runtime.processing_realtime_factor
    gate_definition: processing_wall_time_divided_by_sensor_duration
    exclude_runner_startup_shutdown: true
    replay_wall_realtime_factor_is_diagnostic_only: true
    maximum_trajectory_end_gap_seconds: 0.25
  repetition_aggregation:
    trajectory_accuracy: median
    processing_realtime_factor: median
    peak_rss: maximum
    completion_and_failures: worst_case
    mapping_quality: worst_case
  rivals:
    glim:
      repository: https://github.com/koide3/glim.git
      revision: faa264a1bce1bda406f73457e35511f56cdc2eaa
      revision_kind: tag_v1.2.2
      annotated_tag_object: 2044c47825cff7b508e5ea96c1d295e023b0e36c
      ros2_repository: https://github.com/koide3/glim_ros2.git
      ros2_revision: 4a9e7a4cb084967c8525a1be529ad3ba2a118ae7
      license: MIT
    fast_livo2:
      repository: https://github.com/hku-mars/FAST-LIVO2.git
      revision: 0d2c0346107b75b59934975adec9a6eeeb913c64
      revision_kind: main
      license: GPL-2.0
  tracks:
    glim_cpu_lidar_imu:
      rival: glim
      required_modalities: [lidar, imu]
      accelerator: cpu
    glim_gpu_lidar_imu:
      rival: glim
      required_modalities: [lidar, imu]
      accelerator: cuda
      enabled_when: nvidia_gpu_available
    fast_livo2_lidar_imu_visual:
      rival: fast_livo2
      required_modalities: [lidar, imu, monocular_camera]
      accelerator: cpu
  win_policy:
    minimum_assigned_holdouts: 3
    minimum_holdout_wins: 3
    minimum_primary_improvement_percent: 3.0
    maximum_primary_regression_percent: 2.0
    maximum_mapping_regression_percent: 2.0
    maximum_visual_colour_regression_percent: 2.0
    tie_relative_tolerance: 0.01
    maximum_realtime_factor: 1.0
    maximum_peak_rss_ratio_to_rival: 1.20
    require_zero_incomplete_trajectories: true
    require_zero_catastrophic_failures: true
    require_zero_verified_false_loops: true
    require_geometry_non_regression: true
  # Additive schema-v2 victory evidence gate.  The existing v1 bool gate and
  # run_cross_repo_slam_benchmark.py remain report-only compatibility paths;
  # only this section can produce a SOTA/victory receipt.
  evidence_gate_v2:
    schema_version: 2
    required_systems: [ours, glim, fast_livo2]
    partitions:
      historical: regression
      fresh: primary_fresh
    repetitions: 3
    minimum_aggregate_ape_improvement_percent: 10.0
    maximum_processing_rtf: 1.0
    maximum_primary_regression_percent: 2.0
    maximum_peak_rss_ratio_to_rival: 1.20
    maximum_mapping_regression_percent: 2.0
    minimum_fresh_holdout_slots: 3
    require_fresh_holdout: true
    thread_policy_required_keys:
      - cpu_affinity
      - max_threads
      - omp_num_threads
      - openblas_num_threads
      - mkl_num_threads
      - tbb_num_threads
      - accelerator_policy
    bootstrap_method: fixed_seed_hierarchical_dataset_cluster_bootstrap
    bootstrap_seed: 20260821
    bootstrap_samples: 10000
    common_identity_fields:
      - input_sha256
      - reference_sha256
      - calibration_sha256
      - machine_id
      - hardware_fingerprint
      - thread_policy
      - release
      - scorer_fingerprint
    pinned_identity_fields:
      - revision
      - container_digest
      - toolchain_fingerprint
      - config_sha256
    execution_selection_receipt_path: configs/slam_benchmark_profiles/competitive_execution_selection_2026-08.yaml
    execution_selection_receipt_sha256: d25057bc3660424f9ea852143a215610b8395dddfee0ed1e8c64a5acd1cde0ab
    require_execution_selection_receipt: true
  required_metrics:
    common:
      - trajectory.ape_rmse_m
      - runtime.realtime_factor
      - runtime.peak_rss_mb
      - completion.trajectory_complete
      - completion.process_exit_status
    orientation_ground_truth_only:
      - trajectory.rpe_translation_rmse_m
      - trajectory.rpe_rotation_rmse_deg
    mapping:
      - geometry.plane_thickness_mean_m
      - geometry.plane_thickness_p95_m
      - geometry.planar_coverage
      - loop_closure.accepted_edges
      - loop_closure.verified_false_edges
    visual_track:
      - colour.heldout_rgb_l2_median
      - colour.heldout_rgb_inlier_20
  datasets:
    bringup:
      rtkslam_construction_seq2:
        modalities: [lidar, imu, monocular_camera]
        reference: sparse_total_station_position
        tuning_allowed: false
        reason: previously used for loop and overlap-gate development
    development:
      hilti_exp01:
        modalities: [lidar, imu, monocular_camera]
        reference: sparse_total_station_position
        tuning_allowed: true
    regression_only:
      hilti_exp04:
        modalities: [lidar, imu, monocular_camera]
        reference: sparse_total_station_position
      hilti_exp07:
        modalities: [lidar, imu, monocular_camera]
        reference: sparse_total_station_position
      mid360_public:
        modalities: [lidar, imu]
        reference: cross_validation_only
        forbidden_claims: [absolute_trajectory_accuracy]
    # These are deliberately separate from the already exposed/frozen
    # holdout_slots below.  The frozen_unopened status records a deep-verified
    # identity only; no benchmark run or GT scoring has been performed.
