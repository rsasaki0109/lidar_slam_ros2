        canonical_rosbag2_tree_sha256: bcca9769ebdd87929dbf10af77ae58570ef4e2d67f59458e2f12779748e8cba6
        input_manifest_sha256: f53f7665571ce8c2f458fd935e32e32bf60ac2b5db357ec19b0147e1a2f352c6
        semantic_equivalence_sha256: ac8cd9cc209a867e20bc613d1494f5dd64888c4c0679a5d1231154c72733b47a
        required_modalities: [lidar, imu, monocular_camera]
  phase_gates:
    before_algorithm_tuning:
      require_all_holdout_slots_assigned: true
      require_all_holdout_inputs_frozen: true
      require_official_rival_baselines_complete: true
    before_victory_claim:
      require_holdout_inputs_still_hash_identical: true
      require_three_repetitions_per_system: true
      require_all_win_policy_checks: true
