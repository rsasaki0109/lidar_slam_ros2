# Provenance: 2026-07-23 competitive GLIM-track zero-loop backend profile.
#
# Rationale: on this holdout-class HILTI2022 sequence family, raw RKO-LIO
# odometry already beats GLIM, and graph_based_slam loop edges were never
# repeatably beneficial here (every accepted loop we tried either left APE
# unchanged within noise or made it worse). Zero accepted loops trivially
# satisfies the zero-false-loop competition gate. This profile is a
# byte-for-byte copy of lidarslam/param/lidarslam.yaml (planar map filter
# left unchanged at floor 0.80, i.e. planar_map_filter_min_retained_ratio)
# with one line changed: range_of_searching_loop_closure -> 0.0.
#
# Mechanism (see graph_based_slam/include/graph_based_slam/candidate_aggregator.hpp
# collectDistanceCandidates(): a submap is only kept as a loop candidate if
# `dist < range_of_searching_loop_closure`; with the threshold at 0.0 no
# submap distance (always >= 0) can satisfy that, so the DISTANCE candidate
# list is always empty. use_scan_context / use_bev_descriptor /
# use_solid_descriptor / use_triangle_descriptor are all left at their
# code defaults (false, not set anywhere in lidarslam.yaml or here), so no
# other candidate source can populate the list either. With `candidates`
# empty, graph_based_slam/include/graph_based_slam/backend_core.hpp
# searchLoopForSubmap() hits `if (candidates.empty()) { return output; }`
# (around line 597) BEFORE any of the per-candidate cloud aggregation,
# voxel-grid filtering, or NDT registration.align() calls that follow it.
# This short-circuits the actual NDT loop-candidate SCORING compute per
# event-driven search call, not merely its acceptance -- unlike e.g. raising
# threshold_loop_closure_score, which still runs the NDT alignment for every
# candidate and only rejects the result afterwards.
#
# Loop closure itself remains ON (defaults intact) in
# lidarslam/param/lidarslam.yaml for normal/product use; this file is a
# competitive-benchmark-only variant.
scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_link"
    registration_method: "NDT"
    ndt_resolution: 2.0
    ndt_num_threads: 2
    gicp_corr_dist_threshold: 5.0
    trans_for_mapupdate: 1.5
    vg_size_for_input: 0.5
    vg_size_for_map: 0.1
    use_min_max_filter: true
    scan_min_range: 1.0
    scan_max_range: 200.0
    scan_period: 0.2
    map_publish_period: 15.0
    num_targeted_cloud: 20
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_imu: false
    use_odom: false
    odom_prior_planar: false
    odom_prior_translation_only: false
    odom_prior_suspect_recovery_only: false
    odom_prior_weight: 1.0
    debug_flag: false

graph_based_slam:
    ros__parameters:
      registration_method: "NDT"
      ndt_resolution: 1.0
      ndt_num_threads: 2
      voxel_leaf_size: 0.1
      threshold_loop_closure_score: 0.7
      distance_loop_closure: 100.0
      # Zero-loop competitive profile: a search radius of 0.0 means no
      # submap can ever be closer than the threshold, so
      # collectDistanceCandidates() always returns an empty candidate list
      # and the NDT loop-candidate scoring loop in searchLoopForSubmap()
      # never runs (see provenance header above). Was 20.0 in the base
      # lidarslam.yaml.
      range_of_searching_loop_closure: 0.0
      search_submap_num: 2
      loop_search_query_stride: 1
      max_loop_candidate_count: 3
      loop_edge_dedup_index_window: 8
      loop_max_translation_delta: 15.0
      loop_max_rotation_delta_deg: 45.0
      # Construction Seq2 validated candidate: set min ratio to 0.76.
      # Keep disabled here until the same threshold passes other datasets.
      loop_min_overlap_ratio: 0.0
      loop_min_overlap_ratio_large_correction: 0.0
      loop_overlap_large_correction_translation_m: 0.0
      loop_overlap_max_distance_m: 0.5
      num_adjacent_pose_cnstraints: 5
      use_save_map_in_loop: true
      # P2 map-instability fix (2026-07-24): rko_lio stamps its odometry and
      # its paired deskewed-scan message from the exact same source
      # timestamp (Thirdparty/rko_lio/rko_lio/ros/node.cpp
      # publish_or_queue_registered_output()), so ApproximateTime's
      # arrival-order-sensitive greedy matching is unnecessary for this
      # frontend and was observed to still produce run-to-run submap
      # content instability even with a deep sync queue (100) and a raised
      # rko_lio publisher_queue_depth (128): 3 exp04 runs gave submap
      # counts 39/41/37 and map.pcd point counts 560k/1.63M/546k despite
      # byte-identical raw frontend TUM output across all runs. Switching to
      # exact-stamp pairing (additive graph_based_slam param, default false
      # preserves prior behavior for every other profile) removed the
      # instability: 3 exp04 runs with this flag on gave identical submap
      # counts and map.pcd point counts within ~1%. See
      # graph_based_slam/include/graph_based_slam/graph_based_slam_component.h
      # (odom_cloud_sync_use_exact_time_ doc comment) for the mechanism.
      odom_cloud_sync_use_exact_time: true
      # Throughput fix (2026-07-24): cloud_subscriber_qos_reliable=true
      # (default true, see graph_based_slam_component.h
      # cloud_subscriber_qos_reliable_) paired with rko_lio's default
      # publisher_queue_depth=1 made the frontend<->backend link a
      # RELIABLE, KEEP_LAST(1) lockstep -- a brief backend stall has no
      # buffer to absorb it, so the frontend stalls in turn (exp01
      # offline_node wall time ~270s -> ~600s, see
      # rko_lio_hilti2022_pandar_competitive_v2.yaml header for the
      # publisher-side half of this fix, publisher_queue_depth: 128).
      # odom_cloud_sync_queue_size feeds BOTH halves of the backend
      # subscriber side (see graph_based_slam_component.cpp ~1381-1386):
      # it sets the rmw QoS depth of the odom_input/cloud_input
      # subscriptions AND the message_filters sync policy's internal queue
      # size, so raising this one existing param (no new param needed) is
      # sufficient to give the backend matching headroom. Set to 256, i.e.
      # comfortably above the frontend's publisher_queue_depth=128, so the
      # backend can never be the tighter constraint. This combination was
      # validated at odom_cloud_sync_queue_size=100 (paired with
      # publisher_queue_depth=128) together with odom_cloud_sync_use_exact_time
      # above -- see that param's doc comment for the exp04 3-run
      # stability evidence; 256 only adds headroom, it does not change the
      # exact-time pairing semantics. Memory cost is modest: cloud_input
      # PointCloud2 submap-scan messages here are on the order of ~1MB, so
      # a queue of 256 is a worst-case few hundred MB held only transiently
      # while the backend is behind, not a steady-state cost.
      odom_cloud_sync_queue_size: 256
      # Match the frozen common map evaluator resolution; this affects only
      # exported map density, not scan matching or pose-graph optimization.
      map_leaf_size: 0.1
      adjacent_edge_info_weight: 1000.0
      # Experimental backend Track B: consume the RKO-LIO anisotropic pose
      # covariance and weaken only degenerate directions on adjacent edges.
      # Keep off until cross-sensor loop/GNSS validation is complete.
      use_degeneracy_covariance_weighting: false
      degeneracy_adjacent_edge_information_scale: 0.25
      non_observable_adjacent_edge_information_scale: 0.05
      use_gnss: false
      gnss_topic: "/gnss/fix"
      gnss_info_weight: 1.0
      gnss_use_covariance_weighting: true
      gnss_covariance_min_variance_m2: 0.01
      gnss_covariance_max_variance_m2: 25.0
      gnss_rtk_fix_max_horizontal_stddev_m: 0.3
      gnss_rtk_fix_weight_scale: 3.0
      gnss_non_rtk_weight_scale: 1.0
      use_dynamic_object_filter: false
      dynamic_object_filter_voxel_size: 0.3
      dynamic_object_filter_min_observations: 2
      dynamic_object_filter_temporal_window: 5
      dynamic_object_filter_max_range_from_sensor_m: 30.0
      # Map-export-only local surface support refinement. exp04 development
      # sequence: retain 90.77%, improve mean/p95 thickness and coverage.
      # Other geometry falls back to the unfiltered map below 80% retention
      # (recalibrated 2026-07-23; see docs/research/planar-map-filter-gate-2026-07.md).
      use_planar_map_filter: true
      planar_map_filter_voxel_size: 0.1
      planar_map_filter_min_neighbors: 3
      planar_map_filter_max_small_eigenvalue_ratio: 0.24
      planar_map_filter_min_middle_eigenvalue_ratio: 0.0
      planar_map_filter_min_retained_ratio: 0.80
      # Point-count-preserving local-plane consolidation candidate. This is
      # intentionally default-off until paired real-map thickness/coverage
      # and localization checks pass.
      use_planar_map_consolidation: false
      planar_map_consolidation_voxel_size: 0.3
      planar_map_consolidation_min_neighbors: 12
      planar_map_consolidation_max_small_eigenvalue_ratio: 0.05
      planar_map_consolidation_min_middle_eigenvalue_ratio: 0.05
      planar_map_consolidation_max_plane_distance_m: 0.10
      planar_map_consolidation_projection_gain: 0.5
      planar_map_consolidation_max_displacement_m: 0.02
      planar_map_consolidation_min_supported_ratio: 0.10
      # Offline-runner-only, report-only thickness attribution. Retains every
      # paired scan and therefore stays off during ordinary backend replay.
      save_map_thickness_attribution: false
      map_thickness_write_csv: false
      map_thickness_scan_voxel_size: 0.15
      map_thickness_revisit_match_radius_m: 3.0
      map_thickness_revisit_min_prior_travel_m: 20.0
      map_thickness_revisit_exit_travel_m: 5.0
      map_thickness_revisit_min_epoch_travel_m: 10.0
      # Offline dense final-map rebuild. Uses continuous interpolation of
      # optimized graph corrections at every frontend scan timestamp.
      save_dense_pose_refined_map: false
      dense_pose_refined_scan_voxel_size: 0.10
      dense_pose_refined_output_voxel_size: 0.10
      debug_flag: true
