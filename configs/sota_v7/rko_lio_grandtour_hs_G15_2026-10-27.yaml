# GrandTour configuration HS-G15 (2026-10-27): G12 plus bump image registration with point-to-point terms
# (bench_report/REPORT.md chapter 33.7, data/phase1_global/decision_rule_G15.txt). It is NOT the global configuration G:
# it was chosen on the GrandTour development missions with the Hesai XT-32 + STIM320 rig (mean ATE 0.0422 -> 0.0245 m
# over 15 missions) and fails G's gate on Oxford Keble 05 (0.0700 m, 1.39 x its best profile; not real-time there).
# The maintainer decided (2026-10-27) to prepare a COMFORT submission with it, labelled as GrandTour-specific.
# RKO-LIO algorithm keys only (rko_lio claude/jolly-gauss-dliz8l 05ab894 or later); combine with the rig's keys.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
    keypoint_shortfall_voxel_multiplier: 1.0
    bump_image_registration: true
    bump_image_max_rotation_correction_deg: 2.0
    bump_image_rotation_fallback_window: 10
    bump_image_rotation_fallback_min_count: 3
    bump_image_point_to_point_weight: 1.0
