# SOTA v7 global frontend configuration G, revision G22 (adopted 2026-11-10 by the maintainer's decision,
# bench_report/data/memory/compact_2026-11-10/decision_rule_M1.txt; report chapter 61): rko_lio_global_G12_2026-10-26.yaml
# plus local_map_compact_points, which keeps the local map's points as 32-bit offsets from their voxel's corner (within
# about 1e-8 m at the 0.25 m voxel; peak RSS 22-37 % lower on the development data, every sequence within 3.4 % in ATE).
# RKO-LIO algorithm keys only (rko_lio claude/jolly-gauss-dliz8l a232df3 or later; an older build ignores the key and
# runs G12). Combine with the rig's own keys and, for a rig with a tactical-grade gyro, rig_tactical_gyro_2026-11-09.yaml
# (G21, decision_rule_G21.txt). The gravity window stays off unless the rig's IMU calibration allows it (chapter 30.9).
# rko_lio_global_G12_2026-10-26.yaml stays as it is: decision rules and preregistrations name it by md5.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
    keypoint_shortfall_voxel_multiplier: 1.0
    local_map_compact_points: true
