# GrandTour configuration HS-G15h (2026-11-09): HS-G15g plus a 0.05-deg limit on the registration's per-scan correction
# of the gyro-predicted roll and pitch, and the gyro bias following the kept correction (10-s time constant) for the
# first 30 s after a static initialization (rko_lio a3828fa or later; bench_report/data/grandtour/decision_rule_G15h.txt,
# report chapter 60.6). GrandTour HS rig (Hesai XT-32 + STIM320) only, NOT the global configuration G: the same three
# keys failed the Phase 1 gate on MapsHD's handheld Livox IMU (decision_rule_G19.txt). Mean ATE on the 15 HS
# development missions 0.0174 (G15g) -> 0.0164 m. An older rko_lio build ignores the three keys and runs HS-G15g.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
    keypoint_shortfall_voxel_multiplier: 1.0
    bump_image_registration: true
    bump_image_max_rotation_correction_deg: 2.0
    bump_image_rotation_fallback_window: 10
    bump_image_rotation_fallback_min_count: 3
    bump_image_point_to_point_weight: 1.0
    bump_image_point_to_point_start_distance: 3.0
    output_filter_position_sigma: 0.02
    output_filter_acceleration_noise: 0.003
    output_filter_bias_noise: 1.0e-05
    start_standstill_radius: 1.0
    start_standstill_moving_start_only: true
    start_standstill_hold: true
    start_standstill_hold_radius: 0.05
    start_standstill_bias: none
    moving_start_gravity_window_sec: 5.0
    moving_start_gravity_output_only: true
    max_tilt_correction_deg: 0.05
    gyro_bias_time_constant_sec: 10.0
    gyro_bias_start_sec: 30.0
