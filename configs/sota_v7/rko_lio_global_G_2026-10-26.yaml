# SOTA v7 Phase 1 global frontend configuration G (adopted 2026-10-26, bench_report/REPORT.md chapters 30.10-30.11):
# G10 plus min_icp_keypoints 100 (G11, adopted by the maintainer's decision).
# RKO-LIO algorithm keys only (rko_lio claude/jolly-gauss-dliz8l 7a1f45e or later). Combine with the rig's own keys
# (topics, frames, extrinsics, IMU acceleration unit); bench_report/params/{mapshd_gyro002_jerk1000,
# oxford_keble05_gyro002_jerk1000, exp04_gyro002_jerk1000, p1_koide_V}.yaml carry those for the development data.
# The gravity window stays off unless the rig's IMU calibration allows it (chapter 30.9).
# The two thresholds (12 m, 0.6) were chosen on development data; only a holdout confirms them.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
