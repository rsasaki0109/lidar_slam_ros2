name: docker image

on:
  push:
    branches:
      - develop
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/docker_map_bag.sh
      - scripts/run_first_map_demo.sh
      - scripts/run_docker_demo.sh
      - .github/workflows/docker.yml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  artifact-metadata: write
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: build${{ (github.event_name != 'pull_request') && ' and push' || '' }} (${{ matrix.ros_distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - humble
          - jazzy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve OCI metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.ros_distro }}
            type=raw,value=latest,enable=${{ matrix.ros_distro == 'humble' }}
          labels: |
            org.opencontainers.image.title=lidarslam_ros2
            org.opencontainers.image.description=Installed ROS 2 LiDAR SLAM map-authoring product
            org.opencontainers.image.licenses=BSD-2-Clause

      # Pull requests load and smoke-test both supported images. Pushes to
      # develop (and manual dispatches) publish moving distro convenience tags;
      # tagged releases publish exact v<VERSION>-<distro> tags in release.yml.
      - name: Build (and push) image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            LIDARSLAM_SOURCE_REVISION=${{ steps.source.outputs.revision }}
            LIDARSLAM_SOURCE_DIRTY=false
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=convenience-${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=convenience-${{ matrix.ros_distro }}

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test installed CLI
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ matrix.ros_distro }}
        run: |
          VERSION="$(tr -d '\n' < VERSION)"
          IMAGE_REF="${IMAGE_TAG}"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            IMAGE_REF="ghcr.io/${{ github.repository }}@${EXPECTED_DIGEST}"
            docker pull "${IMAGE_REF}"
          fi
          OBSERVED_VERSION="$(docker run --rm "${IMAGE_REF}" lidarslam-map --version)"
          if [[ "${OBSERVED_VERSION}" != "lidarslam_ros2 ${VERSION}" ]]; then
            echo "unexpected CLI version: ${OBSERVED_VERSION}" >&2
            exit 1
          fi
          docker run --rm --network none "${IMAGE_REF}" \
            lidarslam-map start --help >/tmp/lidarslam-start-help.txt
          grep -Fq 'Detect and configure the sensors' /tmp/lidarslam-start-help.txt
          grep -Fq -- '--map-output-dir' /tmp/lidarslam-start-help.txt
          OBSERVED_REVISION="$(
            docker run --rm "${IMAGE_REF}" python3 -c \
              'import json, pathlib, subprocess; prefix = pathlib.Path(subprocess.check_output(["ros2", "pkg", "prefix", "lidarslam"], text=True).strip()); print(json.loads((prefix / "share/lidarslam/product/product-build-info.json").read_text())["revision"])'
          )"
          if [[ "${OBSERVED_REVISION}" != "${{ steps.source.outputs.revision }}" ]]; then
            echo "unexpected installed source revision: ${OBSERVED_REVISION}" >&2
            exit 1
          fi
          {
            echo "## ${{ matrix.ros_distro }} convenience image"
            echo
            echo "- CLI: \`${OBSERVED_VERSION}\`"
            echo "- Source revision: \`${OBSERVED_REVISION}\`"
            if [[ -n "${EXPECTED_DIGEST}" ]]; then
              echo "- Digest: \`${EXPECTED_DIGEST}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
