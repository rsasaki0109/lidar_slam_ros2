name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing git tag to publish; it must match v<VERSION>
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: validate release metadata
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      bundle_name: ${{ steps.meta.outputs.bundle_name }}
      release_notes: ${{ steps.meta.outputs.release_notes }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\n' < VERSION)"
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"

          if [[ -z "${TAG_NAME}" ]]; then
            echo "failed to resolve release tag name" >&2
            exit 1
          fi
          if [[ "${TAG_NAME}" != "v${VERSION}" ]]; then
            echo "tag ${TAG_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

          git fetch --force --tags
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "git tag ${TAG_NAME} does not exist" >&2
            exit 1
          fi

          RELEASE_NOTES="docs/releases/${TAG_NAME}.md"
          if [[ ! -f "${RELEASE_NOTES}" ]]; then
            echo "release notes not found: ${RELEASE_NOTES}" >&2
            exit 1
          fi

          BUNDLE_NAME="lidarslam_ros2_${TAG_NAME}_release_bundle.tar.gz"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_notes=${RELEASE_NOTES}" >> "${GITHUB_OUTPUT}"
          echo "bundle_name=${BUNDLE_NAME}" >> "${GITHUB_OUTPUT}"

  images:
    name: publish ${{ matrix.ros_distro }} amd64 image
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - humble
          - jazzy

    steps:
      - name: Check out tagged repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.tag_name }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve OCI metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.tag_name }}-${{ matrix.ros_distro }}
          labels: |
            org.opencontainers.image.title=lidarslam_ros2
            org.opencontainers.image.description=Installed ROS 2 LiDAR SLAM map-authoring product
            org.opencontainers.image.licenses=BSD-2-Clause

      - name: Build and publish versioned image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.ros_distro }}

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Pull and smoke-test published digest
        id: smoke
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.tag_name }}-${{ matrix.ros_distro }}
        run: |
          TAG_DIGEST="$(
            docker buildx imagetools inspect "${IMAGE_TAG}" \
              --format '{{json .Manifest}}' | jq -r '.digest'
          )"
          if [[ "${TAG_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
            echo "tag digest ${TAG_DIGEST} != build digest ${EXPECTED_DIGEST}" >&2
            exit 1
          fi

          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}@${EXPECTED_DIGEST}"
          docker pull "${IMAGE_REF}"
          OBSERVED_VERSION="$(docker run --rm "${IMAGE_REF}" lidarslam-map --version)"
          EXPECTED_OUTPUT="lidarslam_ros2 ${EXPECTED_VERSION}"
          if [[ "${OBSERVED_VERSION}" != "${EXPECTED_OUTPUT}" ]]; then
            echo "CLI version '${OBSERVED_VERSION}' != '${EXPECTED_OUTPUT}'" >&2
            exit 1
          fi

          EVIDENCE_FILE="release-image-${{ matrix.ros_distro }}.json"
          TAG_COMMIT="$(git rev-parse HEAD)"
          jq -n \
            --arg schema_version "1" \
            --arg ros_distro "${{ matrix.ros_distro }}" \
            --arg platform "linux/amd64" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${EXPECTED_DIGEST}" \
            --arg git_commit "${TAG_COMMIT}" \
            --arg product_version "${EXPECTED_VERSION}" \
            --arg cli_version "${OBSERVED_VERSION}" \
            '{
              schema_version: ($schema_version | tonumber),
              status: "PASS",
              ros_distro: $ros_distro,
              platform: $platform,
              tag: $tag,
              digest: $digest,
              git_commit: $git_commit,
              product_version: $product_version,
              cli_version: $cli_version
            }' > "${EVIDENCE_FILE}"
          echo "evidence_file=${EVIDENCE_FILE}" >> "${GITHUB_OUTPUT}"
          {
            echo "## ${{ matrix.ros_distro }} release image"
            echo
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo "- CLI: \`${OBSERVED_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release-image evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-image-${{ matrix.ros_distro }}
          path: ${{ steps.smoke.outputs.evidence_file }}
          if-no-files-found: error

  publish:
    name: publish release
    needs:
      - metadata
      - images
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.tag_name }}

      - name: Install Python test dependency
        shell: bash
        run: |
          python3 -m pip install --upgrade pytest

      - name: Validate release docs
        shell: bash
        run: |
          python3 -m pytest graph_based_slam/test/test_docs_entrypoints.py -q
          bash -n scripts/run_autoware_quickstart.sh
          bash -n scripts/download_ntu_viral_tnp01.sh
          bash -n scripts/prepare_velodyne_pointcloud_overlay.sh
          bash -n scripts/run_open_data_applanix_velodyne_gnss_smoke.sh

      - name: Build release bundle
        shell: bash
        run: |
          rm -rf release_bundle
          mkdir -p release_bundle/docs/releases release_bundle/docs/social release_bundle/docs/assets release_bundle/docs/evidence release_bundle/docs/roadmap release_bundle/docs/schemas release_bundle/configs/real_data_e2e release_bundle/output release_bundle/lidarslam/images
          cp README.md CHANGELOG.md CONTRIBUTING.md RELEASING.md VERSION mkdocs.yml SECURITY.md SUPPORT.md CODE_OF_CONDUCT.md GOVERNANCE.md CITATION.cff release_bundle/
          cp docs/index.md docs/getting-started.md docs/product-contract.md docs/golden-path-cli.md docs/operational-reliability.md docs/real-data-e2e.md docs/distribution.md docs/rosdistro-release.md docs/autoware-map-authoring.md docs/autoware-foxglove.md docs/autoware-quickstart.md docs/workflows.md docs/benchmarking.md docs/comparison.md release_bundle/docs/
          cp configs/real_data_e2e/driving_slam_mid360_v1.json release_bundle/configs/real_data_e2e/
          cp docs/evidence/real-data-soak-2026-07-28.md docs/evidence/real-data-soak-2026-07-28.json docs/evidence/docker-first-map-2026-07-28.md docs/evidence/upstream-rko-binary-first-map-2026-07-28.md release_bundle/docs/evidence/
          cp docs/roadmap/v0.9.md release_bundle/docs/roadmap/
          cp docs/schemas/*.json release_bundle/docs/schemas/
          cp -r docs/assets/. release_bundle/docs/assets/
          cp docs/social/autoware_map_authoring_post_v0.2.2.md release_bundle/docs/social/
          cp lidarslam/images/autoware_map_loader_proof.png release_bundle/lidarslam/images/
          cp lidarslam/images/dynamic_object_filter_bag6_summary.svg release_bundle/lidarslam/images/
          cp lidarslam/images/social_autoware_map_authoring.png release_bundle/lidarslam/images/
          cp lidarslam/images/social_autoware_map_authoring_demo.mp4 release_bundle/lidarslam/images/
          cp "${{ needs.metadata.outputs.release_notes }}" release_bundle/docs/releases/
          for artifact in \
            output/benchmark_summary.md \
            output/benchmark_summary.csv \
            output/latest_report.html \
            output/stress_validation_report_20260325.md \
            output/v2_beta_readiness_20260324.md
          do
            if [[ -f "${artifact}" ]]; then
              cp "${artifact}" release_bundle/output/
            fi
          done
          tar -czf "${{ needs.metadata.outputs.bundle_name }}" release_bundle

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.metadata.outputs.tag_name }}-release-bundle
          path: ${{ needs.metadata.outputs.bundle_name }}

      - name: Attest release bundle
        uses: actions/attest@v4
        with:
          subject-path: ${{ needs.metadata.outputs.bundle_name }}

      - name: Download release-image evidence
        uses: actions/download-artifact@v7
        with:
          pattern: release-image-*
          path: release_image_evidence
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: lidarslam_ros2 v${{ needs.metadata.outputs.version }}
          body_path: ${{ needs.metadata.outputs.release_notes }}
          prerelease: true
          files: |
            ${{ needs.metadata.outputs.bundle_name }}
            release_image_evidence/*.json
