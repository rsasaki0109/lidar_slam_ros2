name: Bug report
description: Report a reproducible defect in a maintained product path.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Read SUPPORT.md first. Do not report security vulnerabilities here.
        If the failure happened before a session was created, keep the doctor
        output and first actionable terminal finding; do not invent a support ZIP.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit SHA, or container digest.
      placeholder: v0.9.0 or an exact commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: ROS distribution, Ubuntu version, architecture, and install method.
      placeholder: Jazzy / Ubuntu 24.04 / amd64 / source
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: bash
    validations:
      required: true

  - type: textarea
    id: preflight
    attributes:
      label: Preflight output
      description: Run `lidarslam-map doctor <bag> --json`.
      render: text
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Explain what should have happened and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-first support ZIP and diagnostics
      description: >-
        If a session exists, run `lidarslam-map support <session_bundle>`,
        review the three files, then drag the ZIP here. If no session was
        created, state that clearly and paste the first actionable doctor or
        terminal finding instead. Add separately reviewed logs only when the
        bounded report is insufficient.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and private location data.
          required: true
        - label: I either reviewed every file in the one attached support ZIP, or no session and ZIP existed and I attached no file.
          required: true
        - label: This is not a security vulnerability.
          required: true
