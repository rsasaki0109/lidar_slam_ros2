# Phase 1 candidate G19 (2026-11-09, decision_rule_G19.txt): G12 plus max_tilt_correction_deg 0.05,
# gyro_bias_time_constant_sec 10.0 and gyro_bias_start_sec 30.0. In each scan the registration may change the
# gyro-predicted roll and pitch by at most 0.05 deg (G17); for the first 30 s after a static initialization the gyro
# bias follows the correction the scan keeps (10-s time constant), so a bias the 0.1-s initialization took from a
# standing robot's sway is corrected, and after that, and after a moving start, the bias is left alone (rko_lio
# a3828fa; report chapter 60.5). Candidate only; not G unless adopted.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
    keypoint_shortfall_voxel_multiplier: 1.0
    max_tilt_correction_deg: 0.05
    gyro_bias_time_constant_sec: 10.0
    gyro_bias_start_sec: 30.0
