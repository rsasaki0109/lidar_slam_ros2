# Phase 1 candidate G16 (2026-11-08, decision_rule_G16.txt): G12 plus a re-level of the local frame whenever the
# 20-s window of the IMU's specific force, rotated into the world frame, is at least 2 deg from vertical
# (gravity_window_alignment with gravity_alignment_relevel_map; window, magnitude and yaw-rate gates at rko_lio's
# defaults). The 2 deg lie above the accelerometer's own tilt measured on the development data (0.3-1.2 deg, chapter
# 30.8), so a run whose frame stays within 2 deg of gravity is G12 byte for byte. Candidate only; not G unless adopted.
/**:
  ros__parameters:
    deskew: true
    voxel_size: 0.25
    max_range: 100.0
    min_range: 0.7
    initialization_phase: true
    double_downsample: true
    enable_kidnap_relocalization: false
    reset_on_registration_failure: false
    relocalize_after_scan_gap: false
    max_iterations: 50
    convergence_criterion: 3.0e-05
    icp_keypoint_voxel_multiplier: 2.25
    publisher_queue_depth: 128
    initialization_max_gyro_rad_s: 0.02
    max_expected_jerk: 1000.0
    close_scene_max_median_range: 12.0
    close_scene_max_correspondence_distance: 0.25
    close_scene_localizability_boost: 10.0
    close_scene_localizability_normal_only: true
    close_scene_min_inlier_fraction: 0.6
    min_icp_keypoints: 100
    keypoint_shortfall_voxel_multiplier: 1.0
    gravity_window_alignment: true
    gravity_alignment_relevel_map: true
    gravity_alignment_relevel_min_tilt_rad: 0.034907
