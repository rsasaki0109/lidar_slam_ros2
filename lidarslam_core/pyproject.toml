[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "lidarslam"
version = "0.12.0.dev0"
description = "LiDAR-inertial SLAM that writes Autoware-compatible maps, without a ROS 2 install"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "rosbags>=0.10",
  "scipy>=1.10",  # lanelet2_map.osm of lidarslam-map run --engine core
]

[project.scripts]
lidarslam-map = "lidarslam.product:main"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/rsasaki0109/lidar_slam_ros2"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.22"
cmake.build-type = "Release"
wheel.packages = ["python/lidarslam"]
build.targets = ["_core", "lidarslam_product_build_info"]
install.components = []

[tool.scikit-build.cmake.define]
LIDARSLAM_CORE_BUILD_PYTHON = "ON"
LIDARSLAM_CORE_BUILD_TESTS = "OFF"
LIDARSLAM_CORE_BUILD_BACKEND = "ON"
LIDARSLAM_CORE_BUILD_FRONTEND = "ON"
LIDARSLAM_CORE_INSTALL_PRODUCT = "ON"

# Prebuilt Linux wheels (.github/workflows/wheels.yml). The C++ libraries are built from
# Ubuntu 24.04's sources into /wheel-deps (lidarslam_core/wheel/build_deps.sh, a cached volume)
# and bundled by auditwheel, so `pip install` needs no apt packages.
[tool.cibuildwheel]
# The runner's own architecture (x86_64 or aarch64; wheels.yml runs one job per architecture).
build = ["cp310-manylinux_*", "cp311-manylinux_*", "cp312-manylinux_*", "cp313-manylinux_*"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build-verbosity = 1
test-requires = ["pytest"]
test-command = [
  "python -m pytest -q -p no:cacheprovider {project}/lidarslam_core/test",
  "lidarslam-map --version",
]

[tool.cibuildwheel.linux]
before-all = [
  "git config --global --add safe.directory '*'",
  "bash {project}/lidarslam_core/wheel/build_deps.sh",
]
# CPATH: the prefix is the system include path the core assumes on Ubuntu (3D-BBS includes Boost
# headers without asking CMake for Boost).
environment = { LIDARSLAM_WHEEL_DEPS = "/wheel-deps", CMAKE_PREFIX_PATH = "/wheel-deps", CPATH = "/wheel-deps/include", LD_LIBRARY_PATH = "/wheel-deps/lib:$LD_LIBRARY_PATH", CMAKE_BUILD_PARALLEL_LEVEL = "4" }
